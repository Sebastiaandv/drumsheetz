<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drumsheetz Status</title>
<link rel="stylesheet" href="/pages.css">
<style>
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line);background:var(--panel)}
.banner .big{width:16px;height:16px;border-radius:50%}
.banner h1{margin:0;font-size:18px}
.banner.ok{border-color:var(--ok);background:var(--ok-bg)} .banner.ok .big{background:var(--ok)}
.banner.info{border-color:var(--ok);background:var(--ok-bg)} .banner.info .big{background:var(--ok)}
.banner.warn{border-color:var(--warn);background:var(--warn-bg)} .banner.warn .big{background:var(--warn)}
.banner.err{border-color:var(--err);background:var(--err-bg)} .banner.err .big{background:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px;align-items:start}
@media (max-width:520px){ .grid{grid-template-columns:1fr} }
.row .name{font-weight:600;min-width:150px}
.row .detail{overflow-wrap:anywhere}
.row .tip{color:var(--muted);font-size:12.5px;margin-top:2px}
.row.err .tip,.row.warn .tip{color:var(--text)}
label.tog{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">D</span>Drumsheetz <small>Status</small></div>
  <span class="hint" id="when"></span>
  <span class="spacer"></span>
  <label class="tog"><input type="checkbox" id="auto"> elke minuut vernieuwen</label>
  <button class="btn" id="bRefresh">⟳ Vernieuwen</button>
  <a class="btn" href="/sync" target="drumsheetz-sync">Sync ↗</a>
  <a class="btn" href="/" target="drumsheetz-studio">← Studio</a>
</header>
<main>
  <div class="banner" id="banner"><span class="big"></span><div><h1 id="bannerT">Controleren…</h1><div class="hint" id="bannerS"></div></div></div>
  <div class="grid" id="grid"></div>
</main>
<div id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TITLE = {ok:"Alles werkt", info:"Alles werkt", warn:"Werkt, maar let op", err:"Er werkt iets niet"};
let timer = null, loading = false;
async function load(){
  if(loading) return; loading = true;
  $("#bRefresh").disabled = true;
  try{
    const r = await fetch("/api/health"); const d = await r.json();
    if(!r.ok) throw new Error(d.error || r.statusText);
    draw(d);
  }catch(err){
    $("#banner").className = "banner err"; $("#bannerT").textContent = "De Studio reageert niet";
    $("#bannerS").textContent = err.message + " — draait de Drumsheetz-dienst op de Mac mini?";
  }finally{ loading = false; $("#bRefresh").disabled = false; }
}
function draw(d){
  const bad = d.checks.filter(c=>c.state==="err").length, warn = d.checks.filter(c=>c.state==="warn").length;
  $("#banner").className = "banner " + d.overall;
  $("#bannerT").textContent = TITLE[d.overall];
  $("#bannerS").textContent = bad||warn ? [bad?`${bad} probleem/problemen`:"", warn?`${warn} aandachtspunt(en)`:""].filter(Boolean).join(" · ") : "Alle controles zijn in orde.";
  $("#when").textContent = "bijgewerkt " + new Date(d.time*1000).toLocaleTimeString("nl-NL");
  const groups = [];
  for(const c of d.checks){ let g = groups.find(x=>x.name===c.group); if(!g){ g={name:c.group, items:[]}; groups.push(g); } g.items.push(c); }
  $("#grid").innerHTML = groups.map(g=>{
    const worst = ["ok","ok","warn","err"][Math.max(...g.items.map(c=>["ok","info","warn","err"].indexOf(c.state)))];
    return `<section class="card"><div class="card-h"><span class="dot ${worst}" style="margin-top:0"></span><h2>${esc(g.name)}</h2></div>` +
      g.items.map(c=>`<div class="row ${c.state}"><span class="dot ${c.state}"></span><div class="name">${esc(c.name)}</div>
        <div class="main"><div class="detail">${esc(c.detail)}</div>${c.hint?`<div class="tip">${esc(c.hint)}</div>`:""}</div></div>`).join("") +
      `</section>`;
  }).join("");
}
$("#bRefresh").onclick = load;
$("#auto").onchange = e=>{ clearInterval(timer); if(e.target.checked) timer = setInterval(load, 60000); try{ localStorage.setItem("ds-status-auto", e.target.checked?"1":""); }catch(err){} };
try{ if(localStorage.getItem("ds-status-auto")){ $("#auto").checked = true; timer = setInterval(load, 60000); } }catch(err){}
load();
</script>
</body>
</html>
